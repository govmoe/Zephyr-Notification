<!DOCTYPE html>
<html lang="zh-CN" data-locale="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="app.adminTitle">notice-hub · 后台</title>
<style>
/* Corporate Clean 设计令牌（企业简洁风） */
:root{
  --c-primary:#2563eb; --c-primary-hover:#1d4ed8; --c-primary-50:#eff6ff; --c-ring:#3b82f6;
  --c-success:#16a34a; --c-warning:#d97706; --c-danger:#dc2626;
  --c-bg:#f8fafc; --c-card:#fff; --c-input:#f9fafb;
  --c-border:#e5e7eb; --c-border-strong:#d1d5db;
  --t1:#111827; --t2:#374151; --t3:#6b7280; --t4:#9ca3af;
  --r-lg:8px; --r-xl:12px;
  --sh-sm:0 1px 2px rgba(16,24,40,.05);
  --sh-md:0 4px 12px rgba(16,24,40,.10);
  --ease:cubic-bezier(.16,1,.3,1);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans","Noto Sans SC","Microsoft YaHei",sans-serif;background:var(--c-bg);color:var(--t2);line-height:1.6;font-size:14px}
a{color:var(--c-primary);text-decoration:none}
a:hover{text-decoration:underline}
.container{max-width:900px;margin:0 auto;padding:24px 20px}

/* 顶部导航：白色卡片化导航条 */
header{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:24px;padding:14px 20px;background:var(--c-card);border:1px solid var(--c-border);border-radius:var(--r-xl);box-shadow:var(--sh-sm)}
header h1{font-size:20px;font-weight:600;letter-spacing:-.01em;color:var(--t1)}
.header-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.user-info{display:flex;align-items:center;gap:8px;padding-left:12px;border-left:1px solid var(--c-border)}
.user-avatar{width:30px;height:30px;border-radius:50%;object-fit:cover;border:1px solid var(--c-border)}
.user-avatar-placeholder{width:30px;height:30px;border-radius:50%;background:var(--c-primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;flex-shrink:0}
.user-name{font-size:13px;font-weight:500;color:var(--t1)}
.user-logout{font-size:12px;color:var(--t3);white-space:nowrap}
.user-logout:hover{color:var(--c-danger);text-decoration:none}

/* 按钮：扁平、蓝色主操作、轻投影、按压反馈 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 16px;border:1px solid transparent;border-radius:var(--r-lg);cursor:pointer;font-family:inherit;font-size:14px;font-weight:500;line-height:1.4;background:var(--c-card);color:var(--t2);box-shadow:var(--sh-sm);transition:transform .15s var(--ease),box-shadow .15s var(--ease),background-color .15s var(--ease),border-color .15s var(--ease),color .15s var(--ease);white-space:nowrap}
.btn:hover{transform:translateY(-1px);box-shadow:var(--sh-md);text-decoration:none}
.btn:active{transform:translateY(0) scale(.98);box-shadow:var(--sh-sm)}
.btn:focus-visible{outline:2px solid var(--c-ring);outline-offset:2px}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:var(--sh-sm)}
.btn-primary{background:var(--c-primary);border-color:var(--c-primary);color:#fff}
.btn-primary:hover{background:var(--c-primary-hover);border-color:var(--c-primary-hover)}
.btn-danger{background:var(--c-danger);border-color:var(--c-danger);color:#fff}
.btn-danger:hover{background:#b91c1c;border-color:#b91c1c}
.btn-outline{background:#fff;border-color:var(--c-border-strong);color:var(--t2)}
.btn-outline:hover{border-color:var(--c-primary);color:var(--c-primary)}
.btn-sm{padding:6px 12px;font-size:13px}

/* 卡片面板 */
.panel{background:var(--c-card);border:1px solid var(--c-border);border-radius:var(--r-xl);box-shadow:var(--sh-sm);padding:24px;margin-bottom:20px;transition:box-shadow .2s var(--ease),transform .2s var(--ease)}
.panel h2{font-size:17px;font-weight:600;letter-spacing:-.01em;color:var(--t1);margin-bottom:16px}

/* 表单 */
.form-group{margin-bottom:14px}
.form-group label{display:block;margin-bottom:6px;font-size:13px;font-weight:500;color:var(--t2)}
.form-group .hint{font-weight:400;color:var(--t3)}
.form-group input,.form-group textarea,.form-group select{width:100%;padding:8px 12px;background:var(--c-input);border:1px solid var(--c-border-strong);border-radius:var(--r-lg);font-family:inherit;font-size:14px;color:var(--t1);transition:border-color .15s var(--ease),box-shadow .15s var(--ease),background-color .15s var(--ease)}
.form-group input::placeholder,.form-group textarea::placeholder{color:var(--t4)}
.form-group input:focus,.form-group textarea:focus,.form-group select:focus{outline:none;background:#fff;border-color:var(--c-primary);box-shadow:0 0 0 2px #fff,0 0 0 4px rgba(59,130,246,.35)}
.form-group textarea{resize:vertical;min-height:72px}
.form-row{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
.flex-1{flex:1;min-width:200px}
.checkbox-label{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;font-weight:400;color:var(--t2);flex:1}
.checkbox-label input[type="checkbox"]{width:16px;height:16px;accent-color:var(--c-primary);cursor:pointer}
.checkbox-label input[type="checkbox"]:focus-visible{outline:2px solid var(--c-ring);outline-offset:2px}

/* 列表 */
.list-header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.list-header h2{margin:0}
.list-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.search-input{padding:7px 12px;background:var(--c-input);border:1px solid var(--c-border-strong);border-radius:var(--r-lg);font-size:13px;width:180px;color:var(--t1);transition:border-color .15s var(--ease),box-shadow .15s var(--ease)}
.search-input:focus{outline:none;border-color:var(--c-primary);box-shadow:0 0 0 2px #fff,0 0 0 4px rgba(59,130,246,.35)}
.search-input::placeholder{color:var(--t4)}

/* 通知条目：扁平卡片，悬停微浮 */
.notification-item{display:flex;align-items:flex-start;gap:12px;padding:14px 16px;background:#fff;border:1px solid var(--c-border);border-radius:var(--r-lg);margin-bottom:10px;transition:transform .2s var(--ease),box-shadow .2s var(--ease),border-color .2s var(--ease)}
.notification-item:hover{transform:translateY(-1px);box-shadow:var(--sh-md);border-color:#d8dee8}
.notification-item.emergency{background:#fef2f2;border-color:#fecaca}
.notification-item.inactive{opacity:.55}
.notification-item .dot{width:10px;height:10px;min-width:10px;border-radius:50%;margin-top:6px}
.notification-item .dot.info{background:var(--c-primary)}
.notification-item .dot.success{background:var(--c-success)}
.notification-item .dot.warning{background:var(--c-warning)}
.notification-item .dot.error{background:var(--c-danger)}
.notification-item .info-main{flex:1;min-width:0}
.notification-item .info-title{font-weight:600;font-size:14px;color:var(--t1);display:flex;align-items:center;flex-wrap:wrap;gap:6px}
.notification-item .info-meta{font-size:12px;color:var(--t4);margin-top:3px}
.notification-item .info-content{font-size:13px;color:var(--t3);margin-top:5px;line-height:1.55}
.notification-item .info-content code{background:#f3f4f6;padding:1px 6px;border-radius:6px;font-family:ui-monospace,"SFMono-Regular",Consolas,monospace;font-size:12px;color:var(--c-danger)}
.notification-item .info-content strong{color:var(--t1)}
.notification-item .info-content h2,.notification-item .info-content h3,.notification-item .info-content h4{color:var(--t1);margin:8px 0 4px;font-weight:600}
.notification-item .info-content h2{font-size:15px}.notification-item .info-content h3{font-size:14px}.notification-item .info-content h4{font-size:13px}
.notification-item .info-content pre{background:#f9fafb;border:1px solid var(--c-border);padding:8px 12px;border-radius:var(--r-lg);overflow-x:auto;font-size:12px;margin:6px 0}
.notification-item .info-content pre code{background:none;padding:0;color:var(--t2)}
.notification-item .info-content ul{padding-left:20px;margin:4px 0}
.notification-item .info-content li{color:var(--t3);font-size:13px;margin:2px 0}
.notification-item .badge{font-size:11px;padding:2px 9px;border-radius:999px;font-weight:600;line-height:1.5}
.notification-item .badge.emergency-badge{background:var(--c-danger);color:#fff}
.notification-item .badge.type-badge{background:var(--c-primary-50);color:#1d4ed8}
.notification-item .badge.disabled-badge{background:#f3f4f6;color:var(--t3)}
.notification-item .item-actions{display:flex;gap:6px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end}
.item-actions button{padding:5px 11px;font-size:12px;font-weight:500;border-radius:var(--r-lg);cursor:pointer;font-family:inherit;border:1px solid var(--c-border-strong);background:#fff;color:var(--t2);box-shadow:var(--sh-sm);transition:transform .15s var(--ease),box-shadow .15s var(--ease),border-color .15s var(--ease),color .15s var(--ease)}
.item-actions button:hover{transform:translateY(-1px);border-color:var(--c-primary);color:var(--c-primary)}
.item-actions button:active{transform:translateY(0) scale(.98)}
.item-actions button.btn-del:hover{border-color:var(--c-danger);color:var(--c-danger)}
.emergency-panel{background:#fff;border-color:#fecaca}
.emergency-title{color:var(--c-danger)!important}
.empty{text-align:center;padding:40px 0;color:var(--t4);font-size:13px}

/* 弹窗 */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(17,24,39,.45);z-index:1000}
.modal{display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--c-card);border:1px solid var(--c-border);border-radius:var(--r-xl);box-shadow:var(--sh-md);z-index:1001;width:600px;max-width:95vw}
.modal.active,.modal-overlay.active{display:block}
.modal-content{padding:24px}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.modal-header h3{font-size:17px;font-weight:600;color:var(--t1)}
.modal-close{background:none;border:none;font-size:22px;line-height:1;cursor:pointer;color:var(--t4);width:34px;height:34px;border-radius:var(--r-lg);transition:background-color .15s var(--ease),color .15s var(--ease)}
.modal-close:hover{background:#f3f4f6;color:var(--t1)}
.modal-close:focus-visible{outline:2px solid var(--c-ring);outline-offset:2px}
.modal-hint{font-size:13px;color:var(--t3);margin-bottom:12px}
#embedCode{width:100%;font-family:ui-monospace,Consolas,monospace;font-size:13px;padding:12px;border:1px solid var(--c-border-strong);border-radius:var(--r-lg);background:var(--c-input);color:var(--t2);margin-bottom:12px}
#embedCode:focus{outline:none;border-color:var(--c-primary);box-shadow:0 0 0 2px #fff,0 0 0 4px rgba(59,130,246,.35)}

/* 小铃铛设置 */
.widget-settings-panel h2{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.widget-settings-panel h2 .hint{font-weight:400;font-size:12px;color:var(--t4)}
.settings-group{margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--c-border)}
.settings-group:last-of-type{border-bottom:none;margin-bottom:12px;padding-bottom:0}
.settings-group h3{font-size:13px;font-weight:600;color:var(--t3);margin:0 0 12px}
.widget-config-form .form-group{flex:1;min-width:120px;margin-bottom:10px}
.widget-config-form .form-group label{font-size:12px;color:var(--t3);margin-bottom:5px}
.widget-config-form .form-group input[type="number"],.widget-config-form .form-group select{padding:7px 10px;font-size:13px}
.widget-config-form .form-group input[type="color"]{width:52px;height:38px;padding:3px;cursor:pointer;border-radius:var(--r-lg)}
.widget-config-form .checkbox-group{display:flex;align-items:flex-end;padding-bottom:6px}
.settings-actions{display:flex;gap:12px;align-items:center;margin-top:10px;flex-wrap:wrap}
.settings-status{margin-top:10px;font-size:13px;padding:8px 12px;border-radius:var(--r-lg);display:none}
.settings-status.success{display:block;background:#f0fdf4;color:#15803d;border:1px solid #bbf7d0}
.settings-status.error{display:block;background:#fef2f2;color:#b91c1c;border:1px solid #fecaca}

/* 登录页：浅底 + 白色企业卡片 */
.login-page{display:none;min-height:100vh;background:var(--c-bg);align-items:center;justify-content:center;padding:24px}
.login-page.active{display:flex}
.login-box{background:#fff;border:1px solid var(--c-border);border-radius:var(--r-xl);box-shadow:var(--sh-sm);padding:40px 36px;text-align:center;max-width:400px;width:100%}
.login-box h1{font-size:22px;font-weight:600;letter-spacing:-.01em;color:var(--t1);margin-bottom:8px}
.login-box > p{color:var(--t3);margin-bottom:28px;font-size:14px}
.provider-list{display:flex;flex-direction:column;gap:10px;align-items:stretch}
.provider-loading{color:var(--t3);font-size:14px;padding:12px 0}
.btn-oauth{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:10px 16px;background:#fff;color:var(--t2);border:1px solid var(--c-border-strong);border-radius:var(--r-lg);cursor:pointer;font-family:inherit;font-size:14px;font-weight:500;box-shadow:var(--sh-sm);text-decoration:none;transition:transform .15s var(--ease),box-shadow .15s var(--ease),border-color .15s var(--ease)}
.btn-oauth:hover{transform:translateY(-1px);box-shadow:var(--sh-md);border-color:var(--c-primary);color:var(--c-primary);text-decoration:none}
.btn-oauth:active{transform:translateY(0) scale(.98);box-shadow:var(--sh-sm)}
.btn-oauth:focus-visible{outline:2px solid var(--c-ring);outline-offset:2px}
.btn-oauth svg{width:18px;height:18px;fill:currentColor;flex-shrink:0}
.login-divider{display:flex;align-items:center;gap:12px;margin:22px 0 14px;color:var(--t4);font-size:12px}
.login-divider::before,.login-divider::after{content:'';flex:1;height:1px;background:var(--c-border)}
.password-login-form{text-align:left}
.password-login-form .form-group label{font-size:13px;color:var(--t3)}
.password-login-form .form-group input{background:var(--c-input);color:var(--t1)}
.password-login-form .form-group input::placeholder{color:var(--t4)}
.btn-full{width:100%;margin-top:6px}
.password-actions-secondary{justify-content:center;margin-top:8px}
.btn-link{background:none;border:none;color:var(--c-primary);cursor:pointer;font-family:inherit;font-size:13px;font-weight:500;padding:6px 8px;border-radius:var(--r-lg);margin-top:6px}
.btn-link:hover{text-decoration:underline}
.btn-link:focus-visible{outline:2px solid var(--c-ring);outline-offset:2px}
.login-error{display:none;margin-top:12px;font-size:13px;color:#b91c1c;background:#fef2f2;border:1px solid #fecaca;border-radius:var(--r-lg);padding:8px 12px;text-align:left}
.login-lang-switcher{margin-top:22px;text-align:center}
.login-lang-switcher select option{color:var(--t1)}

/* 语言下拉（顶部 + 登录页共用） */
.lang-switcher{background:#fff;border:1px solid var(--c-border-strong);border-radius:var(--r-lg);padding:7px 10px;font-family:inherit;font-size:12px;font-weight:500;cursor:pointer;color:var(--t2)}
.lang-switcher:focus-visible{outline:2px solid var(--c-ring);outline-offset:2px}
.login-lang-switcher .lang-switcher{background:var(--c-input)}

/* 页脚 / 提示条 */
.app-footer{text-align:center;padding:20px 0 12px;color:var(--t4);font-size:12px}
.app-footer a{color:var(--t4)}
.app-footer a:hover{color:var(--t3)}
.toast{position:fixed;top:24px;right:24px;padding:10px 18px;border-radius:var(--r-lg);box-shadow:var(--sh-md);color:#fff;font-size:14px;font-weight:500;z-index:9999;opacity:0;transform:translateY(-6px);transition:opacity .2s var(--ease),transform .2s var(--ease);pointer-events:none;max-width:90vw}
.toast.show{opacity:1;transform:translateY(0)}
.toast.success{background:var(--c-success)}
.toast.error{background:var(--c-danger)}

@media (max-width:640px){
  .container{padding:14px}
  header{padding:12px 14px}
  .panel{padding:18px}
  .form-row{flex-direction:column;align-items:stretch}
  .flex-1{min-width:0}
  .notification-item{flex-wrap:wrap}
  .notification-item .item-actions{width:100%}
  .login-box{padding:30px 20px}
  .toast{right:14px;left:14px;text-align:center}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>

  <!-- 主体内容（登录后显示） -->
  <div class="container" id="mainContainer" style="display:none">
    <header>
      <h1 data-i18n="app.name">notice-hub</h1>
      <div class="header-actions">
        <button class="btn btn-outline" data-action="open-preview" data-i18n="nav.preview">预览通知</button>
        <button class="btn btn-outline" id="btnGetCode" data-i18n="nav.embedCode">获取嵌入代码</button>
        <select class="lang-switcher" aria-label="Language"></select>
        <div id="userInfo" class="user-info"></div>
      </div>
    </header>

    <!-- 添加通知 -->
    <section class="panel add-panel">
      <h2 data-i18n="notify.addTitle">添加新通知</h2>
      <form id="formAdd">
        <div class="form-row">
          <div class="form-group flex-1">
            <label for="title" data-i18n="notify.title">标题 *</label>
            <input type="text" id="title" data-i18n-placeholder="notify.titlePlaceholder" placeholder="通知标题" required>
          </div>
          <div class="form-group">
            <label for="type" data-i18n="notify.type">类型</label>
            <select id="type">
              <option value="info" data-i18n="notify.typeInfo">信息</option>
              <option value="success" data-i18n="notify.typeSuccess">成功</option>
              <option value="warning" data-i18n="notify.typeWarning">警告</option>
              <option value="error" data-i18n="notify.typeError">错误</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label for="content">
            <span data-i18n="notify.content">内容</span>
            <span class="hint" data-i18n="notify.contentHint">（支持 HTML 和 Markdown）</span>
          </label>
          <textarea id="content" rows="3" data-i18n-placeholder="notify.contentPlaceholder" placeholder="通知详细内容"></textarea>
        </div>
        <div class="form-row">
          <label class="checkbox-label">
            <input type="checkbox" id="is_emergency">
            <span data-i18n="notify.emergency">紧急通知（红色突出显示）</span>
          </label>
          <button type="submit" class="btn btn-primary" data-i18n="notify.add">添加通知</button>
        </div>
      </form>
    </section>

    <!-- 紧急通知 -->
    <section class="panel emergency-panel" id="emergencyPanel" style="display:none">
      <h2 class="emergency-title" data-i18n="notify.emergencyTitle">紧急通知</h2>
      <div id="emergencyList"></div>
    </section>

    <!-- 通知列表 -->
    <section class="panel list-panel">
      <div class="list-header">
        <h2 data-i18n="notify.allTitle">所有通知</h2>
        <div class="list-actions">
          <input type="text" id="searchInput" data-i18n-placeholder="notify.searchPlaceholder" placeholder="搜索通知..." class="search-input">
          <button class="btn btn-sm btn-outline" id="btnRefresh" data-i18n="notify.refresh">刷新</button>
          <button class="btn btn-sm btn-danger" id="btnClearAll" data-i18n="notify.clearAll">清空全部</button>
        </div>
      </div>
      <div id="notificationList"><div class="empty" data-i18n="notify.empty">暂无通知</div></div>
    </section>

    <!-- 小铃铛设置 -->
    <section class="panel widget-settings-panel" id="widgetSettingsPanel">
      <h2><span data-i18n="widget.settingsTitle">小铃铛设置</span> <span class="hint" data-i18n="widget.settingsHint">配置将在保存后对所有已打开的页面生效</span></h2>
      <form id="widgetConfigForm" class="widget-config-form">

        <div class="settings-group">
          <h3 data-i18n="widget.position">位置</h3>
          <div class="form-row">
            <div class="form-group">
              <label data-i18n="widget.positionLabel">屏幕位置</label>
              <select id="widgetPosition">
                <option value="top-right" data-i18n="widget.posTopRight">右上角</option>
                <option value="top-left" data-i18n="widget.posTopLeft">左上角</option>
                <option value="bottom-right" data-i18n="widget.posBottomRight">右下角</option>
                <option value="bottom-left" data-i18n="widget.posBottomLeft">左下角</option>
              </select>
            </div>
            <div class="form-group">
              <label data-i18n="widget.offsetX">水平偏移 (px)</label>
              <input type="number" id="widgetOffsetX" min="0" max="200">
            </div>
            <div class="form-group">
              <label data-i18n="widget.offsetY">垂直偏移 (px)</label>
              <input type="number" id="widgetOffsetY" min="0" max="200">
            </div>
          </div>
        </div>

        <div class="settings-group">
          <h3 data-i18n="widget.buttonStyle">按钮样式</h3>
          <div class="form-row">
            <div class="form-group">

<script>
// NsI18n 前端国际化模块（内联）：动态语言表、探测回退链、插值、DOM 应用、下拉切换
(function (global) {
  'use strict';
  var FALLBACK_CONFIG = { default: 'zh-CN', locales: [
    { code: 'zh-CN', name: '简体中文' }, { code: 'en-US', name: 'English' },
    { code: 'ja-JP', name: '日本語' }, { code: 'ko-KR', name: '한국어' },
    { code: 'fr-FR', name: 'Français' }, { code: 'de-DE', name: 'Deutsch' }
  ]};
  function I18n(options) {
    options = options || {};
    this.baseUrl = options.baseUrl || '';
    this.storageKey = options.storageKey || 'ns_locale';
    this.config = FALLBACK_CONFIG; this.locale = FALLBACK_CONFIG.default; this.strings = {}; this._listeners = [];
    if (typeof options.onLocaleChange === 'function') this._listeners.push(options.onLocaleChange);
  }
  I18n.prototype = {
    async init(preferred) {
      await this.loadConfig();
      var resolved = this.resolveLocale(preferred !== undefined ? preferred : this.readSaved());
      await this.load(resolved, { save: false });
      return this;
    },
    async loadConfig() {
      try {
        var res = await fetch(this.baseUrl + '/api/i18n/config');
        if (res.ok) { var cfg = await res.json(); if (cfg && Array.isArray(cfg.locales) && cfg.locales.length) this.config = cfg; }
      } catch (e) {}
      if (!this.config.default) this.config.default = FALLBACK_CONFIG.default;
    },
    async load(locale, opts) {
      opts = opts || {};
      var strings = await this.fetchStrings(locale);
      var actual = locale;
      if (!strings) { strings = await this.fetchStrings(this.config.default) || {}; actual = this.config.default; }
      this.strings = strings; this.locale = actual;
      if (opts.save !== false) this.writeSaved(actual);
      this.applyDOM(); this.populateSwitchers();
      this._listeners.forEach(fn => { try { fn(actual, strings); } catch (e) {} });
      return this;
    },
    async fetchStrings(locale) {
      try {
        var res = await fetch(this.baseUrl + '/api/i18n/' + encodeURIComponent(locale) + '.json');
        if (!res.ok) return null;
        var data = await res.json();
        return data && Object.keys(data).length ? data : null;
      } catch (e) { return null; }
    },
    get available() { return this.config.locales.map(l => l.code); },
    isValid(code) { return this.available.indexOf(code) > -1; },
    resolveLocale(preferred) {
      if (preferred && this.isValid(preferred)) return preferred;
      var saved = this.readSaved();
      if (saved && this.isValid(saved)) return saved;
      var browserLangs = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language || navigator.userLanguage || ''];
      for (var i = 0; i < browserLangs.length; i++) {
        var tag = String(browserLangs[i] || '').toLowerCase();
        if (!tag) continue;
        var exact = this.available.filter(c => c.toLowerCase() === tag)[0];
        if (exact) return exact;
        var primary = tag.split('-')[0];
        var prefix = this.available.filter(c => c.toLowerCase().split('-')[0] === primary)[0];
        if (prefix) return prefix;
      }
      return this.config.default;
    },
    readSaved() { try { return localStorage.getItem(this.storageKey); } catch (e) { return null; } },
    writeSaved(locale) { try { localStorage.setItem(this.storageKey, locale); } catch (e) {} },
    t(key, params) {
      var val = this.strings[key];
      if (val === undefined) return typeof params === 'string' ? params : key;
      if (params && typeof params === 'object') val = val.replace(/\{(\w+)\}/g, (m, name) => params[name] !== undefined && params[name] !== null ? String(params[name]) : m);
      return val;
    },
    onChange(fn) { if (typeof fn === 'function') this._listeners.push(fn); },
    applyDOM(root) {
      var scope = root || document;
      document.documentElement.lang = this.locale;
      document.documentElement.dataset.locale = this.locale;
      scope.querySelectorAll('[data-i18n]').forEach(el => { var key = el.getAttribute('data-i18n'); if (key) el.innerHTML = this.t(key, el.innerHTML); });
      scope.querySelectorAll('[data-i18n-placeholder]').forEach(el => { var key = el.getAttribute('data-i18n-placeholder'); if (key) el.placeholder = this.t(key, el.placeholder); });
      scope.querySelectorAll('[data-i18n-title]').forEach(el => { var key = el.getAttribute('data-i18n-title'); if (key) el.title = this.t(key, el.title); });
      scope.querySelectorAll('.lang-switcher').forEach(sel => { sel.value = this.locale; });
    },
    populateSwitchers(root) {
      var self = this;
      (root || document).querySelectorAll('.lang-switcher').forEach(sel => {
        if (sel.dataset.nsI18nBound !== '1') {
          sel.addEventListener('change', () => self.load(sel.value));
          sel.dataset.nsI18nBound = '1';
        }
        sel.innerHTML = self.config.locales.map(l => '<option value="' + l.code + '">' + self.t('lang.' + l.code, l.name) + '</option>').join('');
        sel.value = self.locale;
      });
    }
  };
  global.NsI18n = { create: options => new I18n(options) };
})(typeof window !== 'undefined' ? window : this);
</script>

<script>
// 管理后台应用（内联）
const API = '/api/notifications';
const $ = s => document.querySelector(s);

// i18n 实例：语言切换后刷新动态渲染内容
const i18n = NsI18n.create({
  storageKey: 'ns_locale',
  onLocaleChange() {
    syncWidgetLanguageOptions();
    if ($('#mainContainer')?.style.display === 'block') loadNotifications();
    else if ($('#loginPage')?.classList.contains('active')) loadProviders();
  }
});
function __(key, params) { return i18n.t(key, params); }
// 后端错误码本地化：优先 api.xxx 稳定码，其次回退键，最后原始 message
function apiText(res, fallbackKey) {
  if (res && res.code && i18n.strings[res.code]) return __(res.code);
  // 服务端内部错误直接展示后端给出的具体原因（如 KV 未绑定/配额异常），便于自助排查
  if (res && res.code === 'api.serverError' && res.message) return res.message;
  if (fallbackKey) return __(fallbackKey);
  return (res && res.message) || '';
}
// 填充小铃铛默认语言下拉（auto + 全部语言），保留当前选中值
function syncWidgetLanguageOptions() {
  const sel = $('#widgetLanguage');
  if (!sel) return;
  const current = sel.value || 'auto';
  sel.innerHTML = '<option value="auto">' + __('widget.langAuto') + '</option>' +
    i18n.config.locales.map(l => '<option value="' + l.code + '">' + __('lang.' + l.code, l.name) + '</option>').join('');
  sel.value = current;
}

// 工具函数
function escapeHtml(str) { const d = document.createElement('div'); d.textContent = str; return d.innerHTML; }
function toast(msg, type = 'success') {
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.textContent = i18n.t(msg, msg);
  document.body.appendChild(el);
  requestAnimationFrame(() => el.classList.add('show'));
  setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 200); }, 2000);
}
async function fetchJSON(url, options = {}) {
  const headers = { 'Content-Type': 'application/json', ...options.headers };
  const res = await fetch(url, { credentials: 'same-origin', headers, ...options });
  return res.json();
}
function mdToHtml(str) {
  if (!str) return '';
  str = escapeHtml(str);
  str = str.replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>');
  str = str.replace(/`([^`]+)`/g, '<code>$1</code>');
  str = str.replace(/^### (.+)$/gm, '<h4>$1</h4>');
  str = str.replace(/^## (.+)$/gm, '<h3>$1</h3>');
  str = str.replace(/^# (.+)$/gm, '<h2>$1</h2>');
  str = str.replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>');
  str = str.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  str = str.replace(/\*(.+?)\*/g, '<em>$1</em>');
  str = str.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  str = str.replace(/^[\-\*] (.+)$/gm, '<li>$1</li>');
  str = str.replace(/(<li>.*<\/li>)/s, '<ul>$1</ul>');
  return str;
}

// 统一事件委托
document.body.addEventListener('click', e => {
  const btn = e.target.closest('[data-action]');
  if (!btn) return;
  switch (btn.dataset.action) {
    case 'open-preview': window.open('/preview.html', '_blank'); break;
    case 'open-modal': openModal(); break;
    case 'close-modal': closeModal(); break;
    case 'show-register':
      $('#passwordLoginForm').style.display = 'none';
      $('#registerForm').style.display = '';
      $('#loginError').style.display = 'none';
      break;
    case 'show-login':
      $('#registerForm').style.display = 'none';
      $('#passwordLoginForm').style.display = '';
      $('#loginError').style.display = 'none';
      break;
    case 'reset-widget-config': resetWidgetConfig(); break;
    case 'toggle-active': toggleActive(btn.dataset.id, btn.dataset.current === 'true'); break;
    case 'toggle-emergency': toggleEmergency(btn.dataset.id, btn.dataset.set === 'true'); break;
    case 'delete-notify': deleteNotification(btn.dataset.id); break;
    case 'copy-code': copyCode(); break;
  }
});

// 弹窗与复制
function openModal() { $('#modalCode').classList.add('active'); $('#modalOverlay').classList.add('active'); }
function closeModal() { $('#modalCode').classList.remove('active'); $('#modalOverlay').classList.remove('active'); }
async function copyCode() {
  const ta = $('#embedCode');
  if (!ta) return;
  try { await navigator.clipboard.writeText(ta.value); } catch { ta.select(); document.execCommand('copy'); }
  toast(__('action.copied'));
}

// 认证：加载登录方式
async function loadProviders() {
  const providerList = $('#providerList');
  const loginError = $('#loginError');
  try {
    const res = await fetchJSON('/api/auth/providers');
    if (res.success && res.data) {
      const { oauth, password } = res.data;
      let html = '';
      if (oauth && oauth.length > 0) {
        html += oauth.map(p => '<a href="' + escapeHtml(p.authUrl) + '" class="btn-oauth">' + p.icon +
          '<span>' + __('login.oauthLogin', { provider: escapeHtml(p.displayName) }) + '</span></a>').join('');
      }
      if (!oauth?.length && !password) {
        providerList.innerHTML = '<div class="provider-loading">' + __('login.noProvider') + '</div>';
        loginError.style.display = 'block';
        loginError.textContent = __('login.noProviderHint');
        return;
      }
      providerList.innerHTML = html;
      document.querySelectorAll('.password-login-form').forEach(f => {
        if (password) f.style.display = (f.id === 'passwordLoginForm') ? '' : 'none';
        else f.style.display = 'none';
      });
    } else {
      providerList.innerHTML = '<div class="provider-loading">' + __('login.noProvider') + '</div>';
    }
  } catch (e) {
    providerList.innerHTML = '<div class="provider-loading">' + __('login.loadFailed') + '</div>';
    loginError.style.display = 'block';
    loginError.textContent = __('login.loadFailedHint');
  }
}
async function checkAuth() {
  const res = await fetchJSON('/api/auth/me');
  const userArea = $('#userInfo');
  if (res.success && res.data) {
    const user = res.data;
    $('#mainContainer').style.display = 'block';
    $('#loginPage').classList.remove('active');
    const displayName = escapeHtml(user.name || user.login);
    const providerLabel = user.provider ? ' (' + user.provider + ')' : '';
    userArea.innerHTML =
      (user.avatar ? '<img src="' + escapeHtml(user.avatar) + '" alt="" class="user-avatar">'
                   : '<div class="user-avatar-placeholder">' + displayName[0].toUpperCase() + '</div>') +
      '<span class="user-name">' + displayName + providerLabel + '</span>' +
      '<a href="/auth/logout" class="user-logout">' + __('login.logout') + '</a>';
    loadNotifications();
  } else {
    $('#mainContainer').style.display = 'none';
    $('#loginPage').classList.add('active');
    loadProviders();
  }
}

// 密码登录 / 注册
$('#passwordLoginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const username = $('#loginUsername').value.trim();
  const password = $('#loginPassword').value;
  if (!username || !password) return toast(__('login.invalidCredentials'), 'error');
  try {
    const res = await fetchJSON('/api/auth/login', { method: 'POST', body: JSON.stringify({ username, password }) });
    if (res.success) { toast(__('login.loginSuccess')); checkAuth(); }
    else toast(apiText(res, 'login.invalidCredentials'), 'error');
  } catch { toast(__('login.loginFailed'), 'error'); }
});
$('#registerForm').addEventListener('submit', async e => {
  e.preventDefault();
  const username = $('#regUsername').value.trim();
  const password = $('#regPassword').value;
  if (!username || !password) return toast(__('login.invalidCredentials'), 'error');
  try {
    const res = await fetchJSON('/api/auth/register', { method: 'POST', body: JSON.stringify({ username, password }) });
    if (res.success) {
      toast(__('login.registerSuccess'));
      $('#registerForm').style.display = 'none';
      $('#passwordLoginForm').style.display = '';
      $('#loginUsername').value = username;
      $('#loginPassword').value = '';
    } else toast(apiText(res, 'login.registerFailed'), 'error');
  } catch { toast(__('login.registerFailed'), 'error'); }
});

// 通知列表
async function loadNotifications() {
  const res = await fetchJSON(API);
  const list = $('#notificationList');
  const emergencyPanel = $('#emergencyPanel');
  const query = ($('#searchInput')?.value || '').toLowerCase();
  if (!res.success || !res.data.length) {
    list.innerHTML = '<div class="empty">' + __('notify.empty') + '</div>';
    emergencyPanel.style.display = 'none';
    return;
  }
  const emergencies = res.data.filter(n => n.is_emergency && n.is_active);
  let all = res.data;
  if (query) all = all.filter(n => n.title.toLowerCase().includes(query) || (n.content && n.content.toLowerCase().includes(query)));
  if (emergencies.length > 0) {
    emergencyPanel.style.display = '';
    const fe = query ? emergencies.filter(n => n.title.toLowerCase().includes(query) || (n.content && n.content.toLowerCase().includes(query))) : emergencies;
    $('#emergencyList').innerHTML = fe.length ? fe.map(renderItem).join('') : '<div class="empty">' + __('notify.noMatch') + '</div>';
  } else emergencyPanel.style.display = 'none';
  list.innerHTML = all.length ? all.map(renderItem).join('') : '<div class="empty">' + __('notify.noMatch') + '</div>';
}
function renderItem(n) {
  const typeLabels = { info: __('notify.typeInfo'), success: __('notify.typeSuccess'), warning: __('notify.typeWarning'), error: __('notify.typeError') };
  const cls = [];
  if (n.is_emergency) cls.push('emergency');
  if (!n.is_active) cls.push('inactive');
  return '<div class="notification-item ' + cls.join(' ') + '" data-id="' + escapeHtml(n.id) + '">' +
    '<div class="dot ' + escapeHtml(n.type) + '"></div>' +
    '<div class="info-main"><div class="info-title">' + escapeHtml(n.title) +
      (n.is_emergency ? '<span class="badge emergency-badge">' + __('notify.badgeEmergency') + '</span>' : '') +
      '<span class="badge type-badge">' + (typeLabels[n.type] || n.type) + '</span>' +
      (!n.is_active ? '<span class="badge disabled-badge">' + __('notify.badgeDisabled') + '</span>' : '') +
    '</div>' +
    (n.content ? '<div class="info-content">' + mdToHtml(n.content) + '</div>' : '') +
    '<div class="info-meta">ID: ' + escapeHtml(n.id.slice(0, 8)) + '... | ' + escapeHtml(n.created_at) + '</div></div>' +
    '<div class="item-actions">' +
      '<button data-action="toggle-active" data-id="' + escapeHtml(n.id) + '" data-current="' + n.is_active + '">' + (n.is_active ? __('notify.btnDisable') : __('notify.btnEnable')) + '</button>' +
      (n.is_emergency
        ? '<button data-action="toggle-emergency" data-id="' + escapeHtml(n.id) + '" data-set="false">' + __('notify.btnCancelEmergency') + '</button>'
        : '<button data-action="toggle-emergency" data-id="' + escapeHtml(n.id) + '" data-set="true">' + __('notify.btnSetEmergency') + '</button>') +
      '<button class="btn-del" data-action="delete-notify" data-id="' + escapeHtml(n.id) + '">' + __('notify.btnDelete') + '</button>' +
    '</div></div>';
}
async function deleteNotification(id) {
  if (!confirm(__('action.deleteConfirm'))) return;
  const res = await fetchJSON(API + '/' + id, { method: 'DELETE' });
  if (res.success) { toast(__('action.deleteSuccess')); loadNotifications(); } else toast(apiText(res), 'error');
}
async function toggleActive(id, current) {
  const res = await fetchJSON(API + '/' + id, { method: 'PUT', body: JSON.stringify({ is_active: current ? 0 : 1 }) });
  if (res.success) loadNotifications(); else toast(apiText(res), 'error');
}
async function toggleEmergency(id, set) {
  const res = await fetchJSON(API + '/' + id, { method: 'PUT', body: JSON.stringify({ is_emergency: set ? 1 : 0 }) });
  if (res.success) { toast(set ? __('action.setEmergencySuccess') : __('action.cancelEmergencySuccess')); loadNotifications(); }
  else toast(apiText(res), 'error');
}

// 添加 / 刷新 / 搜索 / 清空
$('#formAdd').addEventListener('submit', async e => {
  e.preventDefault();
  const title = $('#title').value.trim();
  if (!title) return toast(__('notify.titleRequired'), 'error');
  const res = await fetchJSON(API, {
    method: 'POST',
    body: JSON.stringify({ title, content: $('#content').value.trim(), type: $('#type').value, is_emergency: $('#is_emergency').checked })
  });
  if (res.success) {
    toast(__('notify.addSuccess'));
    $('#formAdd').reset();
    $('#is_emergency').checked = false;
    loadNotifications();
  } else toast(apiText(res, 'notify.addFailed'), 'error');
});
$('#btnRefresh').addEventListener('click', loadNotifications);
$('#searchInput').addEventListener('input', loadNotifications);
$('#btnClearAll').addEventListener('click', async () => {
  if (!confirm(__('action.clearConfirm'))) return;
  const res = await fetchJSON(API + '/clear-all', { method: 'POST' });
  if (res.success) { toast(__('action.clearSuccess')); loadNotifications(); }
});

// 小铃铛配置读写
const WIDGET_FIELDS = {
  position: 'widgetPosition', offsetX: 'widgetOffsetX', offsetY: 'widgetOffsetY',
  buttonSize: 'widgetButtonSize', buttonColor: 'widgetButtonColor', buttonBg: 'widgetButtonBg',
  showBadge: 'widgetShowBadge', badgeBg: 'widgetBadgeBg', badgeColor: 'widgetBadgeColor',
  panelWidth: 'widgetPanelWidth', borderRadius: 'widgetBorderRadius',
  primaryColor: 'widgetPrimaryColor', successColor: 'widgetSuccessColor',
  warningColor: 'widgetWarningColor', errorColor: 'widgetErrorColor',
  animationEnabled: 'widgetAnimationEnabled', soundEnabled: 'widgetSoundEnabled', language: 'widgetLanguage'
};
async function loadWidgetConfig() {
  try {
    const res = await fetchJSON('/api/widget-config');
    if (res.success && res.data) {
      Object.keys(WIDGET_FIELDS).forEach(key => {
        const el = $('#' + WIDGET_FIELDS[key]);
        if (!el) return;
        const val = res.data[key];
        if (el.type === 'checkbox') el.checked = val === true || val === 1;
        else if (el.type === 'color') el.value = val || '#000000';
        else el.value = val !== undefined && val !== null ? val : '';
      });
    }
  } catch (e) {}
}
$('#widgetConfigForm').addEventListener('submit', async e => {
  e.preventDefault();
  const statusEl = $('#widgetConfigStatus');
  statusEl.textContent = '';
  const config = {};
  Object.keys(WIDGET_FIELDS).forEach(key => {
    const el = $('#' + WIDGET_FIELDS[key]);
    if (!el) return;
    if (el.type === 'checkbox') config[key] = el.checked;
    else if (el.type === 'color') config[key] = el.value || '#000000';
    else if (el.type === 'number') config[key] = parseInt(el.value, 10) || 0;
    else config[key] = el.value;
  });
  try {
    const res = await fetchJSON('/api/widget-config', { method: 'PUT', body: JSON.stringify(config) });
    if (res.success) {
      statusEl.className = 'settings-status success';
      statusEl.textContent = __('widget.saved');
      toast(__('widget.saved'));
    } else {
      statusEl.className = 'settings-status error';
      statusEl.textContent = (res.errors || []).join('; ') || __('widget.saveFailed');
    }
  } catch {
    statusEl.className = 'settings-status error';
    statusEl.textContent = __('widget.saveFailed');
  }
});
async function resetWidgetConfig() {
  if (!confirm(__('widget.resetConfirm'))) return;
  try {
    const res = await fetchJSON('/api/widget-config/reset', { method: 'POST' });
    if (res.success) { toast(__('widget.resetDone')); loadWidgetConfig(); }
  } catch { toast(__('widget.saveFailed'), 'error'); }
}

// 嵌入代码
$('#btnGetCode').addEventListener('click', async () => {
  const me = await fetchJSON('/api/auth/me');
  const uid = (me.success && me.data) ? '?u=' + me.data.id : '';
  const res = await fetchJSON('/api/widget-code' + uid);
  if (res.success) { $('#embedCode').value = res.data; openModal(); }
});

// 页脚版本号（运行时读取，避免硬编码）
async function loadVersion() {
  try {
    const res = await fetchJSON('/api/version');
    if (res.success && res.data && res.data.version) $('#footerVersion').textContent = 'v' + res.data.version;
  } catch (e) {}
}

(async function init() {
  await i18n.init();
  syncWidgetLanguageOptions();
  loadVersion();
  checkAuth();
  loadWidgetConfig();
})();
</script>
